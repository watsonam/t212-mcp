[project]
name = "t212-mcp"
version = "0.1.0"
description = "MCP server for the Trading 212 public API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3", "httpx>=0.27", "keyring>=25"]

[project.scripts]
t212-mcp = "t212_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
