[project]
name = "t212-mcp"
version = "0.1.0"
description = "MCP server for the Trading 212 public API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Adam Watson" }]
keywords = ["mcp", "trading212", "model-context-protocol", "stocks", "isa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["mcp>=2.3", "httpx>=0.27", "keyring>=25", "pydantic>=2.12"]

[project.urls]
Homepage = "https://github.com/watsonam/t212-mcp"
Issues = "https://github.com/watsonam/t212-mcp/issues"
Security = "https://github.com/watsonam/t212-mcp/blob/main/SECURITY.md"

[project.scripts]
t212-mcp = "t212_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
